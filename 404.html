<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found · CA CDL Class A Study</title>
<meta name="robots" content="noindex">
<style>body{margin:0;font:1rem/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f7f7f8;color:#1b1b1f}main{max-width:640px;margin:10vh auto;padding:24px}a{color:#2557d6}a:focus-visible{outline:3px solid #2557d6;outline-offset:2px}@media (prefers-color-scheme:dark){body{background:#121316;color:#ececf1}a{color:#7ea2ff}}</style>
</head><body><main id="main"><h1>Page not found</h1><p id="msg" role="status">Looking for the study app…</p><p><a id="home" href="./">Go to the CA CDL Class A Study app</a></p></main>
<script>
/* Works at the site root or any subpath: walk up the URL until the app's manifest is found, then go there. */
(async function(){
  const parts=location.pathname.split('/');parts.pop();
  for(let n=parts.length;n>=1;n--){
    const base=parts.slice(0,n).join('/')+'/';
    try{const r=await fetch(base+'manifest.webmanifest',{method:'GET',cache:'no-store'});
      if(r.ok&&/json|manifest/.test(r.headers.get('content-type')||'manifest')){document.getElementById('home').href=base;document.getElementById('msg').textContent='Opening the study app…';location.replace(base);return}}catch(e){}
  }
  document.getElementById('msg').textContent='This page does not exist. Use the link below to open the app.';
})();
</script></body></html>
