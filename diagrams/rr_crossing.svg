<svg xmlns="http://www.w3.org/2000/svg" width="980" height="480" viewBox="0 0 980 480" role="img" aria-labelledby="t-rr_crossing d-rr_crossing"><title id="t-rr_crossing">Figure GK-9. Stopping safely at a railroad crossing</title><desc id="d-rr_crossing">A truck stopped before railroad tracks with a green dimension showing 15 to 50 feet from the nearest rail and amber 4-way flashers on.</desc><rect width="980" height="480" fill="#ffffff"/><defs><marker id="arrow-rr_crossing" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2557d6"/></marker><marker id="arrowink-rr_crossing" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1b1b1f"/></marker><marker id="arrowred-rr_crossing" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b42318"/></marker><marker id="arrowok-rr_crossing" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#166534"/></marker></defs><text x="20" y="28" font-size="18" text-anchor="start" font-weight="700" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">Figure GK-9. Stopping safely at a railroad crossing</text><rect x="0" y="150" width="980" height="120" rx="0" fill="#f3f4f6" stroke="none" stroke-width="0"/><line x1="0" y1="210" x2="980" y2="210" stroke="#ffffff" stroke-width="3" stroke-dasharray="20 14"/><line x1="700" y1="60" x2="700" y2="360" stroke="#1b1b1f" stroke-width="5"/><line x1="760" y1="60" x2="760" y2="360" stroke="#1b1b1f" stroke-width="5"/><line x1="690" y1="70" x2="770" y2="70" stroke="#8a4b00" stroke-width="3"/><line x1="690" y1="90" x2="770" y2="90" stroke="#8a4b00" stroke-width="3"/><line x1="690" y1="110" x2="770" y2="110" stroke="#8a4b00" stroke-width="3"/><line x1="690" y1="130" x2="770" y2="130" stroke="#8a4b00" stroke-width="3"/><line x1="690" y1="150" x2="770" y2="150" stroke="#8a4b00" stroke-width="3"/><line x1="690" y1="170" x2="770" y2="170" stroke="#8a4b00" stroke-width="3"/><line x1="690" y1="190" x2="770" y2="190" stroke="#8a4b00" stroke-width="3"/><line x1="690" y1="210" x2="770" y2="210" stroke="#8a4b00" stroke-width="3"/><line x1="690" y1="230" x2="770" y2="230" stroke="#8a4b00" stroke-width="3"/><line x1="690" y1="250" x2="770" y2="250" stroke="#8a4b00" stroke-width="3"/><line x1="690" y1="270" x2="770" y2="270" stroke="#8a4b00" stroke-width="3"/><line x1="690" y1="290" x2="770" y2="290" stroke="#8a4b00" stroke-width="3"/><line x1="690" y1="310" x2="770" y2="310" stroke="#8a4b00" stroke-width="3"/><line x1="690" y1="330" x2="770" y2="330" stroke="#8a4b00" stroke-width="3"/><line x1="690" y1="350" x2="770" y2="350" stroke="#8a4b00" stroke-width="3"/><line x1="700" y1="300" x2="450" y2="300" stroke="#166534" stroke-width="2"/><line x1="700" y1="290" x2="700" y2="310" stroke="#166534" stroke-width="2"/><line x1="450" y1="290" x2="450" y2="310" stroke="#166534" stroke-width="2"/><text x="575" y="322" font-size="13" text-anchor="middle" font-weight="700" fill="#166534" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">stop 15 to 50 feet from the nearest rail</text><rect x="450" y="170" width="60" height="30" rx="0" fill="none" stroke="#166534" stroke-width="2" stroke-dasharray="5 3"/><g transform="translate(440,235) rotate(0)"><rect x="-46" y="-11.0" width="46" height="22" rx="4" fill="#e8eefc" stroke="#1b1b1f" stroke-width="2"/><rect x="-42" y="-8.0" width="12" height="16" rx="0" fill="#ffffff" stroke="#1b1b1f" stroke-width="1"/><g transform="translate(-40,0) rotate(0)"><rect x="-260" y="-12.0" width="260" height="24" rx="2" fill="#ffffff" stroke="#1b1b1f" stroke-width="2"/></g></g><circle cx="400" cy="222" r="6" fill="#f59e0b" stroke="none"/><circle cx="400" cy="248" r="6" fill="#f59e0b" stroke="none"/><text x="390" y="120" font-size="13" text-anchor="end" font-weight="700" fill="#8a4b00" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">4-way flashers ON</text><text x="30" y="400" font-size="14" text-anchor="start" font-weight="400" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">• Required full stop: when the cargo makes it mandatory (for example placarded HazMat) or the law requires it (49 CFR 392.10).</text><text x="30" y="422" font-size="14" text-anchor="start" font-weight="400" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">• Check traffic behind you, stop gradually, use a pullout lane if there is one, turn on the 4-way flashers.</text><text x="30" y="444" font-size="14" text-anchor="start" font-weight="400" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">• Look and listen both ways. Do not shift gears while crossing the tracks.</text></svg>