<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600" role="img" aria-labelledby="t d">
  <title id="t">Figure AB-1. Dual air brake system</title>
  <desc id="d">Drawn from CA Commercial Driver Handbook DL 650 (REV 12/2019) sections 5.1, 5.2, 5.3 and DL 650 X air-brake check. Not an official DMV/FMCSA schematic.</desc>
  <rect width="980" height="600" fill="#ffffff"/>
  
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2557d6"/></marker>
      <marker id="arrowink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1b1b1f"/></marker>
      <marker id="arrowred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b42318"/></marker>
      <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#166534"/></marker>
    </defs>

  <text x="20" y="26" font-size="17" text-anchor="start" font-weight="700" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >Figure AB-1. Dual air brake system</text>
  <rect x="30" y="80" width="150" height="58" rx="8" fill="#e8eefc" stroke="#2557d6" stroke-width="1.6"/><text x="105.0" y="105.0" font-size="12" text-anchor="middle" font-weight="700" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >Compressor</text><text x="105.0" y="121.0" font-size="10" text-anchor="middle" font-weight="400" fill="#4a4d55" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >pumps air (engine-driven)</text><line x1="180" y1="109" x2="214" y2="109" stroke="#2557d6" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"/><rect x="216" y="80" width="170" height="58" rx="8" fill="#e8eefc" stroke="#2557d6" stroke-width="1.6"/><text x="301.0" y="105.0" font-size="12" text-anchor="middle" font-weight="700" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >Governor</text><text x="301.0" y="121.0" font-size="10" text-anchor="middle" font-weight="400" fill="#4a4d55" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >cut-out about 125 psi (120-140)</text><line x1="386" y1="109" x2="424" y2="109" stroke="#2557d6" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"/><rect x="426" y="70" width="170" height="78" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.6"/><text x="511.0" y="105.0" font-size="12" text-anchor="middle" font-weight="700" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >Supply (wet) tank</text><text x="511.0" y="121.0" font-size="10" text-anchor="middle" font-weight="400" fill="#4a4d55" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >collects oil/water; drain daily</text><text x="511" y="162" font-size="11" text-anchor="middle" font-weight="600" fill="#b42318" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >Safety valve opens at 150 psi</text><line x1="511" y1="148" x2="511" y2="188" stroke="#2557d6" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"/><line x1="300" y1="188" x2="760" y2="188" stroke="#2557d6" stroke-width="2" stroke-linecap="round" /><line x1="300" y1="188" x2="300" y2="218" stroke="#2557d6" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"/><line x1="760" y1="188" x2="760" y2="218" stroke="#2557d6" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"/><rect x="215" y="220" width="170" height="70" rx="8" fill="#e8eefc" stroke="#2557d6" stroke-width="1.6"/><text x="300.0" y="251.0" font-size="12" text-anchor="middle" font-weight="700" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >Primary tank</text><text x="300.0" y="267.0" font-size="10" text-anchor="middle" font-weight="400" fill="#4a4d55" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >usually rear (drive) brakes</text><rect x="675" y="220" width="170" height="70" rx="8" fill="#e8eefc" stroke="#2557d6" stroke-width="1.6"/><text x="760.0" y="251.0" font-size="12" text-anchor="middle" font-weight="700" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >Secondary tank</text><text x="760.0" y="267.0" font-size="10" text-anchor="middle" font-weight="400" fill="#4a4d55" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >usually front brakes</text><text x="511" y="214" font-size="11" text-anchor="middle" font-weight="600" fill="#2557d6" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >Dual air system -- two independent service circuits</text><text x="300" y="306" font-size="11" text-anchor="middle" font-weight="400" fill="#4a4d55" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >Drain cock at the bottom of each tank -- drain daily</text><text x="760" y="306" font-size="11" text-anchor="middle" font-weight="400" fill="#4a4d55" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >A one-way check valve keeps air if the wet tank fails</text><line x1="300" y1="290" x2="300" y2="330" stroke="#2557d6" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"/><line x1="760" y1="290" x2="760" y2="330" stroke="#2557d6" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"/><rect x="215" y="332" width="170" height="58" rx="8" fill="#f4f5f7" stroke="#94a3b8" stroke-width="1.6"/><text x="300.0" y="357.0" font-size="12" text-anchor="middle" font-weight="700" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >Primary gauge</text><text x="300.0" y="373.0" font-size="10" text-anchor="middle" font-weight="400" fill="#4a4d55" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >know normal pressure</text><rect x="675" y="332" width="170" height="58" rx="8" fill="#f4f5f7" stroke="#94a3b8" stroke-width="1.6"/><text x="760.0" y="357.0" font-size="12" text-anchor="middle" font-weight="700" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >Secondary gauge</text><text x="760.0" y="373.0" font-size="10" text-anchor="middle" font-weight="400" fill="#4a4d55" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >or dual-needle gauge</text><line x1="385" y1="361" x2="454" y2="361" stroke="#2557d6" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"/><line x1="675" y1="361" x2="606" y2="361" stroke="#2557d6" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"/><rect x="456" y="332" width="150" height="58" rx="8" fill="#e8eefc" stroke="#2557d6" stroke-width="1.6"/><text x="531.0" y="357.0" font-size="12" text-anchor="middle" font-weight="700" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >Foot (treadle) valve</text><text x="531.0" y="373.0" font-size="10" text-anchor="middle" font-weight="400" fill="#4a4d55" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >applies service brakes</text><line x1="531" y1="390" x2="531" y2="424" stroke="#2557d6" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"/><rect x="30" y="430" width="200" height="70" rx="8" fill="#e8eefc" stroke="#2557d6" stroke-width="1.6"/><text x="130.0" y="461.0" font-size="12" text-anchor="middle" font-weight="700" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >Service brake chambers</text><text x="130.0" y="477.0" font-size="10" text-anchor="middle" font-weight="400" fill="#4a4d55" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >air applies the foundation brakes</text><rect x="250" y="430" width="230" height="70" rx="8" fill="#ffedd5" stroke="#9a3412" stroke-width="1.6"/><text x="365.0" y="461.0" font-size="12" text-anchor="middle" font-weight="700" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >Spring (parking/emergency) brakes</text><text x="365.0" y="477.0" font-size="10" text-anchor="middle" font-weight="400" fill="#4a4d55" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >held OFF by air; come on at 20-45 psi</text><rect x="500" y="430" width="230" height="70" rx="8" fill="#e8eefc" stroke="#2557d6" stroke-width="1.6"/><text x="615.0" y="461.0" font-size="12" text-anchor="middle" font-weight="700" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >Tractor protection valve</text><text x="615.0" y="477.0" font-size="10" text-anchor="middle" font-weight="400" fill="#4a4d55" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >protects tractor air if trailer breaks away</text><rect x="750" y="430" width="210" height="70" rx="8" fill="#e8eefc" stroke="#2557d6" stroke-width="1.6"/><text x="855.0" y="461.0" font-size="12" text-anchor="middle" font-weight="700" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >Glad hands</text><text x="855.0" y="477.0" font-size="10" text-anchor="middle" font-weight="400" fill="#4a4d55" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >Service (blue) / Emergency (red) to trailer</text><line x1="200" y1="465" x2="248" y2="465" stroke="#2557d6" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"/><line x1="480" y1="465" x2="498" y2="465" stroke="#2557d6" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"/><line x1="730" y1="465" x2="748" y2="465" stroke="#2557d6" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"/><text x="30" y="520" font-size="11.5" text-anchor="start" font-weight="400" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif"><tspan x="30" dy="0">Low-air warning (light/buzzer, sometimes a wig-wag) must come on when tank pressure falls between 55 and 75 psi</tspan><tspan x="30" dy="15">(or 1/2 cut-out on older vehicles). Skills-test script: warning must activate before pressure drops below 55 psi.</tspan><tspan x="30" dy="15">Stop as soon as the warning comes on -- do not wait for spring brakes. Never push the foot valve with spring brakes already on.</tspan></text>
  <text x="20" y="586" font-size="9.5" text-anchor="start" font-weight="400" fill="#4a4d55" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >Drawn from CA Commercial Driver Handbook DL 650 (REV 12/2019) sections 5.1, 5.2, 5.3 and DL 650 X air-brake check. Not an official DMV/FMCSA schematic.</text>
</svg>
