<text x="250" y="286" font-size="11" text-anchor="middle" font-weight="700" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">PRIMARY</text>
<text x="250" y="300" font-size="11" text-anchor="middle" font-weight="700" fill="#2557d6" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">125 psi</text><circle cx="730" cy="250" r="86" fill="#f7f7f8" stroke="#1b1b1f" stroke-width="3"/>
<circle cx="730" cy="250" r="8" fill="#1b1b1f"/>
<line x1="680.5" y1="299.5" x2="669.2" y2="310.8" stroke="#1b1b1f" stroke-width="2"/><text x="689.0" y="295.0" font-size="9" text-anchor="middle" font-weight="600" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">0</text><line x1="660.5" y1="285.4" x2="653.4" y2="289.0" stroke="#1b1b1f" stroke-width="1"/><line x1="653.0" y1="262.2" x2="645.1" y2="263.5" stroke="#1b1b1f" stroke-width="1"/><line x1="653.0" y1="237.8" x2="645.1" y2="236.5" stroke="#1b1b1f" stroke-width="1"/><line x1="660.5" y1="214.6" x2="653.4" y2="211.0" stroke="#1b1b1f" stroke-width="1"/><line x1="680.5" y1="200.5" x2="669.2" y2="189.2" stroke="#1b1b1f" stroke-width="2"/><text x="689.0" y="213.0" font-size="9" text-anchor="middle" font-weight="600" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">50</text><line x1="694.6" y1="180.5" x2="691.0" y2="173.4" stroke="#1b1b1f" stroke-width="1"/><line x1="717.8" y1="173.0" x2="716.5" y2="165.1" stroke="#1b1b1f" stroke-width="1"/><line x1="742.2" y1="173.0" x2="743.5" y2="165.1" stroke="#1b1b1f" stroke-width="1"/><line x1="765.4" y1="180.5" x2="769.0" y2="173.4" stroke="#1b1b1f" stroke-width="1"/><line x1="779.5" y1="200.5" x2="790.8" y2="189.2" stroke="#1b1b1f" stroke-width="2"/><text x="771.0" y="213.0" font-size="9" text-anchor="middle" font-weight="600" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">100</text><line x1="799.5" y1="214.6" x2="806.6" y2="211.0" stroke="#1b1b1f" stroke-width="1"/><line x1="807.0" y1="237.8" x2="814.9" y2="236.5" stroke="#1b1b1f" stroke-width="1"/><line x1="807.0" y1="262.2" x2="814.9" y2="263.5" stroke="#1b1b1f" stroke-width="1"/><line x1="799.5" y1="285.4" x2="806.6" y2="289.0" stroke="#1b1b1f" stroke-width="1"/><line x1="779.5" y1="299.5" x2="790.8" y2="310.8" stroke="#1b1b1f" stroke-width="2"/><text x="771.0" y="295.0" font-size="9" text-anchor="middle" font-weight="600" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">150</text>
<path d="M 666.4 313.6 A 90 90 0 0 1 677.1 177.2" fill="none" stroke="#b42318" stroke-width="6" stroke-linecap="butt"/>
<path d="M 793.6 186.4 A 90 90 0 0 1 820.0 250.0" fill="none" stroke="#166534" stroke-width="6" stroke-linecap="butt"/>
<line x1="730" y1="250" x2="792.0" y2="250.0" stroke="#2557d6" stroke-width="3" stroke-linecap="round"/>
<text x="730" y="286" font-size="11" text-anchor="middle" font-weight="700" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">SECONDARY</text>
<text x="730" y="300" font-size="11" text-anchor="middle" font-weight="700" fill="#2557d6" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">125 psi</text><rect x="40" y="384" width="16" height="16" rx="3" fill="#166534" stroke="#166534" stroke-width="1"/><text x="66" y="397" font-size="12" text-anchor="start" font-weight="400" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">Normal charged range / cut-out: about 125 psi (often 120–140). Governor stops the compressor.</text><rect x="40" y="422" width="16" height="16" rx="3" fill="#2557d6" stroke="#2557d6" stroke-width="1"/><text x="66" y="435" font-size="12" text-anchor="start" font-weight="400" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">Cut-in: about 100 psi. Governor restarts the compressor. Build at least 100 psi on both gauges before driving a dual system.</text><rect x="40" y="460" width="16" height="16" rx="3" fill="#b42318" stroke="#b42318" stroke-width="1"/><text x="66" y="473" font-size="12" text-anchor="start" font-weight="400" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">Low-air warning (light and/or buzzer) must come on before 55 psi. Spring brakes typically come on between 20 and 45 psi. Safety valve about 150 psi.</text><text x="20" y="516" font-size="12" text-anchor="start" font-weight="400" fill="#4a4d55" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">Read both gauges. If one circuit is low, you may still have the other — but stop and fix the leak. Do not wait for spring brakes.</text>
  <text x="20" y="526" font-size="9.5" text-anchor="start" font-weight="400" fill="#4a4d55" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">Typical values from CA Commercial Driver Handbook DL 650 (REV 12/2019) §§5.1–5.3 (governor cut-in/cut-out, low-air warning, spring brakes, safety valve). Study drawing, not a specific OEM gauge.</text>
</svg>
