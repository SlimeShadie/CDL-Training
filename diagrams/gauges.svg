  <desc id="d">Typical values from CA Commercial Driver Handbook DL 650 (REV 12/2019) §§5.1–5.3 (governor cut-in/cut-out, low-air warning, spring brakes, safety valve). Study drawing, not a specific OEM gauge.</desc>
  <rect width="980" height="540" fill="#ffffff"/>
  <text x="20" y="26" font-size="17" text-anchor="start" font-weight="700" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">Figure AB-3. Typical air-brake gauge readings</text>
  <text x="20" y="52" font-size="12" text-anchor="start" font-weight="400" fill="#4a4d55" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">Typical dual-system primary and secondary service gauges. Numbers are the handbook’s usual values; always also use the vehicle’s manual.</text><circle cx="250" cy="250" r="86" fill="#f7f7f8" stroke="#1b1b1f" stroke-width="3"/>
