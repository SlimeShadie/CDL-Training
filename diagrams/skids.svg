<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="460" viewBox="0 0 980 460" role="img" aria-labelledby="t-skids d-skids"><title id="t-skids">Figure GK-7. Three kinds of skids and what to do</title><desc id="d-skids">Three panels: a drive-wheel skid where the tractor jackknifes; a front-wheel skid where the truck slides straight even though the wheels are turned; and a trailer skid where the trailer swings out. Text below gives the handbook recovery steps.</desc><rect width="980" height="460" fill="#ffffff"/><defs><marker id="arrow-skids" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2557d6"/></marker><marker id="arrowink-skids" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1b1b1f"/></marker><marker id="arrowred-skids" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b42318"/></marker><marker id="arrowok-skids" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#166534"/></marker></defs><text x="20" y="28" font-size="18" text-anchor="start" font-weight="700" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">Figure GK-7. Three kinds of skids and what to do</text><rect x="30" y="50" width="300" height="300" rx="8" fill="#fafafa" stroke="#6b7280" stroke-width="1"/><text x="180" y="78" font-size="16" text-anchor="middle" font-weight="700" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">Drive-wheel (rear) skid</text><text x="180" y="98" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">Tractor jackknife</text><line x1="50" y1="300" x2="310" y2="300" stroke="#6b7280" stroke-width="1" stroke-dasharray="6 4"/><text x="54" y="318" font-size="12" text-anchor="start" font-weight="400" fill="#6b7280" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">line of travel</text><g transform="translate(245,215) rotate(-35)"><rect x="-46" y="-11" width="46" height="22" rx="4" fill="#fdecea" stroke="#b42318" stroke-width="2"/></g><rect x="70" y="200" width="140" height="24" rx="2" fill="#ffffff" stroke="#1b1b1f" stroke-width="2"/><path d="M 230 240 q 20 30 50 25" fill="none" stroke="#b42318" stroke-width="2" marker-end="url(#arrowred-skids)"/><text x="180" y="150" font-size="13" text-anchor="middle" font-weight="400" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">Drive wheels lock or spin;</text><text x="180" y="168" font-size="13" text-anchor="middle" font-weight="400" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">trailer pushes tractor sideways</text><rect x="350" y="50" width="300" height="300" rx="8" fill="#fafafa" stroke="#6b7280" stroke-width="1"/><text x="500" y="78" font-size="16" text-anchor="middle" font-weight="700" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">Front-wheel skid</text><text x="500" y="98" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">Front plows straight ahead</text><line x1="370" y1="300" x2="630" y2="300" stroke="#6b7280" stroke-width="1" stroke-dasharray="6 4"/><text x="374" y="318" font-size="12" text-anchor="start" font-weight="400" fill="#6b7280" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">line of travel</text><g transform="translate(600,212) rotate(0)"><rect x="-46" y="-11.0" width="46" height="22" rx="4" fill="#e8eefc" stroke="#1b1b1f" stroke-width="2"/><rect x="-42" y="-8.0" width="12" height="16" rx="0" fill="#ffffff" stroke="#1b1b1f" stroke-width="1"/><g transform="translate(-40,0) rotate(0)"><rect x="-150" y="-12.0" width="150" height="24" rx="2" fill="#ffffff" stroke="#1b1b1f" stroke-width="2"/></g></g><path d="M 605 212 l 30 0" fill="none" stroke="#8a4b00" stroke-width="3" marker-end="url(#arrowink-skids)"/><path d="M 585 196 q 10 -20 30 -18" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowink-skids)"/><text x="500" y="150" font-size="13" text-anchor="middle" font-weight="400" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">Steering has no effect;</text><text x="500" y="168" font-size="13" text-anchor="middle" font-weight="400" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">front tires slide straight</text><rect x="670" y="50" width="300" height="300" rx="8" fill="#fafafa" stroke="#6b7280" stroke-width="1"/><text x="820" y="78" font-size="16" text-anchor="middle" font-weight="700" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">Trailer skid</text><text x="820" y="98" font-size="13" text-anchor="middle" font-weight="400" fill="#6b7280" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">Trailer swings out (trailer jackknife)</text><line x1="690" y1="300" x2="950" y2="300" stroke="#6b7280" stroke-width="1" stroke-dasharray="6 4"/><text x="694" y="318" font-size="12" text-anchor="start" font-weight="400" fill="#6b7280" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">line of travel</text><rect x="870" y="200" width="46" height="22" rx="4" fill="#e8eefc" stroke="#1b1b1f" stroke-width="2"/><g transform="translate(870,211) rotate(-28)"><rect x="-140" y="-12" width="140" height="24" rx="2" fill="#fdecea" stroke="#2557d6" stroke-width="2"/></g><path d="M 750 260 q -10 20 10 30" fill="none" stroke="#2557d6" stroke-width="2" marker-end="url(#arrow-skids)"/><text x="820" y="150" font-size="13" text-anchor="middle" font-weight="400" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">Trailer wheels lock;</text><text x="820" y="168" font-size="13" text-anchor="middle" font-weight="400" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">trailer swings out</text><text x="30" y="380" font-size="14" text-anchor="start" font-weight="400" fill="#b42318" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">• Drive-wheel braking skid: stop braking, turn quickly in the direction you want to go, then countersteer.</text><text x="30" y="404" font-size="14" text-anchor="start" font-weight="400" fill="#8a4b00" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">• Front-wheel skid: let the vehicle slow down; slow as quickly as possible without skidding.</text><text x="30" y="428" font-size="14" text-anchor="start" font-weight="400" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">• Most serious skids come from driving too fast for road conditions.</text></svg>