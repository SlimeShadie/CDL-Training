<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="t d">
  <title id="t">Figure GK-6. Emergency warning-device placement</title>
  <desc id="d">Placement from CA Commercial Driver Handbook DL 650 (REV 12/2019) warning-device rules (Section 2) and 49 CFR 392.22. Use bidirectional reflective triangles as required; fusees have extra restrictions around some HazMat (see HM study guide).</desc>
  <rect width="980" height="520" fill="#ffffff"/>
  
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2557d6"/></marker>
      <marker id="arrowink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1b1b1f"/></marker>
      <marker id="arrowred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b42318"/></marker>
      <marker id="arrowok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#166534"/></marker>
    </defs>

  <text x="20" y="26" font-size="17" text-anchor="start" font-weight="700" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >Figure GK-6. Emergency warning-device placement</text>
  <rect x="30" y="50" width="920" height="200" rx="10" fill="#f4f5f7" stroke="#94a3b8" stroke-width="1"/><text x="48" y="78" font-size="15" text-anchor="start" font-weight="700" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >Two-lane or undivided road</text><rect x="80" y="140" width="200" height="44" rx="4" fill="#1e3a8a" stroke="#1b1b1f" stroke-width="1"/><text x="180" y="168" font-size="12" text-anchor="middle" font-weight="700" fill="#ffffff" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >Stopped CMV</text><path d="M 80 110 L 96 138 L 64 138 Z" fill="#f59e0b" stroke="#9a3412" stroke-width="1.5" /><path d="M 80 118 L 89 134 L 71 134 Z" fill="#ffffff" stroke="none" stroke-width="1.5" /><text x="80" y="156" font-size="11" text-anchor="middle" font-weight="700" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >100 ft ahead</text><path d="M 320 110 L 336 138 L 304 138 Z" fill="#f59e0b" stroke="#9a3412" stroke-width="1.5" /><path d="M 320 118 L 329 134 L 311 134 Z" fill="#ffffff" stroke="none" stroke-width="1.5" /><text x="320" y="156" font-size="11" text-anchor="middle" font-weight="700" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >within 10 ft</text><path d="M 520 110 L 536 138 L 504 138 Z" fill="#f59e0b" stroke="#9a3412" stroke-width="1.5" /><path d="M 520 118 L 529 134 L 511 134 Z" fill="#ffffff" stroke="none" stroke-width="1.5" /><text x="520" y="156" font-size="11" text-anchor="middle" font-weight="700" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >100 ft behind</text><text x="48" y="220" font-size="12" text-anchor="start" font-weight="400" fill="#4a4d55" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >Place devices within 10 ft of the front or rear corner, plus 100 ft behind and 100 ft ahead.</text><rect x="30" y="270" width="920" height="200" rx="10" fill="#f4f5f7" stroke="#94a3b8" stroke-width="1"/><text x="48" y="298" font-size="15" text-anchor="start" font-weight="700" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >One-way or divided highway</text><rect x="80" y="360" width="200" height="44" rx="4" fill="#1e3a8a" stroke="#1b1b1f" stroke-width="1"/><text x="180" y="388" font-size="12" text-anchor="middle" font-weight="700" fill="#ffffff" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >Stopped CMV</text><path d="M 320 330 L 336 358 L 304 358 Z" fill="#f59e0b" stroke="#9a3412" stroke-width="1.5" /><path d="M 320 338 L 329 354 L 311 354 Z" fill="#ffffff" stroke="none" stroke-width="1.5" /><text x="320" y="376" font-size="11" text-anchor="middle" font-weight="700" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >10 ft</text><path d="M 520 330 L 536 358 L 504 358 Z" fill="#f59e0b" stroke="#9a3412" stroke-width="1.5" /><path d="M 520 338 L 529 354 L 511 354 Z" fill="#ffffff" stroke="none" stroke-width="1.5" /><text x="520" y="376" font-size="11" text-anchor="middle" font-weight="700" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >100 ft</text><path d="M 720 330 L 736 358 L 704 358 Z" fill="#f59e0b" stroke="#9a3412" stroke-width="1.5" /><path d="M 720 338 L 729 354 L 711 354 Z" fill="#ffffff" stroke="none" stroke-width="1.5" /><text x="720" y="376" font-size="11" text-anchor="middle" font-weight="700" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >200 ft toward approaching traffic</text><text x="48" y="440" font-size="12" text-anchor="start" font-weight="400" fill="#4a4d55" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >If you stop behind a hill, curve, or obstruction, place a warning back beyond it (up to 500 ft) so approaching drivers can see it.</text>
  <text x="20" y="506" font-size="9.5" text-anchor="start" font-weight="400" fill="#4a4d55" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >Placement from CA Commercial Driver Handbook DL 650 (REV 12/2019) warning-device rules (Section 2) and 49 CFR 392.22. Use bidirectional reflective triangles as required; fusees have extra restrictions around some HazMat (see HM study guide).</text>
</svg>
