<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="t-bcs_modern d-bcs_modern"><title id="t-bcs_modern">Figure SK-4. Modernized basic control skills exercises (California, 2023 on)</title><desc id="d-bcs_modern">Four panels: Forward Stop, Straight-Line Backing, Forward Offset Tracking, and Reverse Offset Backing, each with cone-lined lanes and an arrow showing the path.</desc><rect width="980" height="520" fill="#ffffff"/><defs><marker id="arrow-bcs_modern" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2557d6"/></marker><marker id="arrowink-bcs_modern" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1b1b1f"/></marker><marker id="arrowred-bcs_modern" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b42318"/></marker><marker id="arrowok-bcs_modern" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#166534"/></marker></defs><text x="20" y="28" font-size="18" text-anchor="start" font-weight="700" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">Figure SK-4. Modernized basic control skills exercises (California, 2023 on)</text><rect x="20" y="50" width="460" height="210" rx="8" fill="#fafafa" stroke="#6b7280" stroke-width="1"/><text x="34" y="74" font-size="15" text-anchor="start" font-weight="700" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">1. Forward Stop</text><text x="34" y="248" font-size="12" text-anchor="start" font-weight="400" fill="#6b7280" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">Drive forward, stop once with the front in the stop box. Brake, neutral, horn.</text><path d="M 80 113 L 86 125 L 74 125 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1"/><path d="M 80 183 L 86 195 L 74 195 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1"/><path d="M 140 113 L 146 125 L 134 125 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1"/><path d="M 140 183 L 146 195 L 134 195 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1"/><path d="M 200 113 L 206 125 L 194 125 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1"/><path d="M 200 183 L 206 195 L 194 195 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1"/><path d="M 260 113 L 266 125 L 254 125 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1"/><path d="M 260 183 L 266 195 L 254 195 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1"/><path d="M 320 113 L 326 125 L 314 125 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1"/><path d="M 320 183 L 326 195 L 314 195 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1"/><path d="M 380 113 L 386 125 L 374 125 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1"/><path d="M 380 183 L 386 195 L 374 195 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1"/><line x1="60" y1="120" x2="440" y2="120" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 4"/><line x1="60" y1="190" x2="440" y2="190" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 4"/><rect x="400" y="132" width="36" height="46" rx="0" fill="none" stroke="#166534" stroke-width="2" stroke-dasharray="5 3"/><text x="418" y="126" font-size="11" text-anchor="middle" font-weight="400" fill="#166534" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">stop box</text><g transform="translate(390,155) rotate(0)"><rect x="-40" y="-10.0" width="40" height="20" rx="4" fill="#e8eefc" stroke="#1b1b1f" stroke-width="2"/><rect x="-36" y="-7.0" width="12" height="14" rx="0" fill="#ffffff" stroke="#1b1b1f" stroke-width="1"/><g transform="translate(-34,0) rotate(0)"><rect x="-150" y="-11.0" width="150" height="22" rx="2" fill="#ffffff" stroke="#1b1b1f" stroke-width="2"/></g></g><line x1="170" y1="155" x2="220" y2="155" stroke="#2557d6" stroke-width="3" marker-end="url(#arrow-bcs_modern)"/><rect x="500" y="50" width="460" height="210" rx="8" fill="#fafafa" stroke="#6b7280" stroke-width="1"/><text x="514" y="74" font-size="15" text-anchor="start" font-weight="700" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">2. Straight-Line Backing</text><text x="514" y="248" font-size="12" text-anchor="start" font-weight="400" fill="#6b7280" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">Back straight through the alley. Free: 1 pull-up, 1 look.</text><path d="M 560 113 L 566 125 L 554 125 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1"/><path d="M 560 183 L 566 195 L 554 195 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1"/><path d="M 620 113 L 626 125 L 614 125 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1"/><path d="M 620 183 L 626 195 L 614 195 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1"/><path d="M 680 113 L 686 125 L 674 125 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1"/><path d="M 680 183 L 686 195 L 674 195 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1"/><path d="M 740 113 L 746 125 L 734 125 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1"/><path d="M 740 183 L 746 195 L 734 195 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1"/><path d="M 800 113 L 806 125 L 794 125 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1"/><path d="M 800 183 L 806 195 L 794 195 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1"/><path d="M 860 113 L 866 125 L 854 125 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1"/><path d="M 860 183 L 866 195 L 854 195 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1"/><line x1="540" y1="120" x2="920" y2="120" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 4"/><line x1="540" y1="190" x2="920" y2="190" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 4"/><g transform="translate(890,155) rotate(0)"><rect x="-40" y="-10.0" width="40" height="20" rx="4" fill="#e8eefc" stroke="#1b1b1f" stroke-width="2"/><rect x="-36" y="-7.0" width="12" height="14" rx="0" fill="#ffffff" stroke="#1b1b1f" stroke-width="1"/><g transform="translate(-34,0) rotate(0)"><rect x="-150" y="-11.0" width="150" height="22" rx="2" fill="#ffffff" stroke="#1b1b1f" stroke-width="2"/></g></g><line x1="680" y1="155" x2="620" y2="155" stroke="#b42318" stroke-width="3" marker-end="url(#arrowred-bcs_modern)"/><text x="650" y="215" font-size="12" text-anchor="middle" font-weight="400" fill="#b42318" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">back straight</text><rect x="20" y="280" width="460" height="210" rx="8" fill="#fafafa" stroke="#6b7280" stroke-width="1"/><text x="34" y="304" font-size="15" text-anchor="start" font-weight="700" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">3. Forward Offset Tracking</text><text x="34" y="478" font-size="12" text-anchor="start" font-weight="400" fill="#6b7280" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">Pull forward into the left lane, right rear tire between cone and line.</text><line x1="50" y1="400" x2="450" y2="400" stroke="#6b7280" stroke-width="1" stroke-dasharray="8 6"/><path d="M 280 393 L 286 405 L 274 405 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1"/><g transform="translate(250,430) rotate(0)"><rect x="-40" y="-10.0" width="40" height="20" rx="4" fill="#e8eefc" stroke="#1b1b1f" stroke-width="2"/><rect x="-36" y="-7.0" width="12" height="14" rx="0" fill="#ffffff" stroke="#1b1b1f" stroke-width="1"/><g transform="translate(-34,0) rotate(0)"><rect x="-150" y="-11.0" width="150" height="22" rx="2" fill="#ffffff" stroke="#1b1b1f" stroke-width="2"/></g></g><path d="M 260 430 q 60 0 110 -60" fill="none" stroke="#2557d6" stroke-width="3" marker-end="url(#arrow-bcs_modern)"/><text x="380" y="360" font-size="12" text-anchor="start" font-weight="400" fill="#2557d6" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">opposite lane</text><rect x="500" y="280" width="460" height="210" rx="8" fill="#fafafa" stroke="#6b7280" stroke-width="1"/><text x="514" y="304" font-size="15" text-anchor="start" font-weight="700" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">4. Reverse Offset Backing</text><text x="514" y="478" font-size="12" text-anchor="start" font-weight="400" fill="#6b7280" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">Back into the offset alley; rear within the 3-ft box. Free: 2 pull-ups, 2 looks.</text><line x1="530" y1="350" x2="750" y2="350" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 4"/><line x1="530" y1="400" x2="750" y2="400" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 4"/><rect x="530" y="350" width="24" height="50" rx="0" fill="none" stroke="#166534" stroke-width="2" stroke-dasharray="5 3"/><text x="542" y="344" font-size="11" text-anchor="middle" font-weight="400" fill="#166534" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif">3-ft box</text><g transform="translate(930,430) rotate(0)"><rect x="-40" y="-10.0" width="40" height="20" rx="4" fill="#e8eefc" stroke="#1b1b1f" stroke-width="2"/><rect x="-36" y="-7.0" width="12" height="14" rx="0" fill="#ffffff" stroke="#1b1b1f" stroke-width="1"/><g transform="translate(-34,0) rotate(0)"><rect x="-150" y="-11.0" width="150" height="22" rx="2" fill="#ffffff" stroke="#1b1b1f" stroke-width="2"/></g></g><path d="M 740 430 q -80 0 -120 -55" fill="none" stroke="#b42318" stroke-width="3" marker-end="url(#arrowred-bcs_modern)"/></svg>