stroke="#1b1b1f" stroke-width="0"/><rect x="760" y="310" width="22" height="8" rx="1" fill="#1b1b1f" stroke="#1b1b1f" stroke-width="0"/><circle cx="40" cy="140" r="14" fill="#2557d6" stroke="#2557d6" stroke-width="1.5"/><text x="40" y="145" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >1</text><text x="60" y="145" font-size="12" text-anchor="start" font-weight="600" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >Approach / overview</text><circle cx="120" cy="130" r="14" fill="#2557d6" stroke="#2557d6" stroke-width="1.5"/><text x="120" y="135" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >2</text><text x="140" y="135" font-size="12" text-anchor="start" font-weight="600" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >Engine compartment</text><circle cx="215" cy="130" r="14" fill="#2557d6" stroke="#2557d6" stroke-width="1.5"/><text x="215" y="135" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >3</text><text x="235" y="135" font-size="12" text-anchor="start" font-weight="600" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >In-cab / start engine</text><circle cx="40" cy="235" r="14" fill="#2557d6" stroke="#2557d6" stroke-width="1.5"/><text x="40" y="240" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >4</text><text x="60" y="240" font-size="12" text-anchor="start" font-weight="600" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >Lights on -- front</text><circle cx="120" cy="360" r="14" fill="#2557d6" stroke="#2557d6" stroke-width="1.5"/><text x="120" y="365" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >5</text><text x="140" y="365" font-size="12" text-anchor="start" font-weight="600" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >Driver / left tractor</text><circle cx="315" cy="360" r="14" fill="#2557d6" stroke="#2557d6" stroke-width="1.5"/><text x="315" y="365" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >6</text><text x="335" y="365" font-size="12" text-anchor="start" font-weight="600" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >Coupling / fifth wheel</text><circle cx="560" cy="360" r="14" fill="#2557d6" stroke="#2557d6" stroke-width="1.5"/><text x="560" y="365" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >7</text><text x="580" y="365" font-size="12" text-anchor="start" font-weight="600" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >Left trailer / rear axle</text><circle cx="860" cy="235" r="14" fill="#2557d6" stroke="#2557d6" stroke-width="1.5"/><text x="860" y="240" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >8</text><text x="840" y="240" font-size="12" text-anchor="end" font-weight="600" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >Rear of trailer</text><circle cx="560" cy="130" r="14" fill="#2557d6" stroke="#2557d6" stroke-width="1.5"/><text x="560" y="135" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >9</text><text x="580" y="135" font-size="12" text-anchor="start" font-weight="600" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >Right trailer</text><circle cx="315" cy="80" r="14" fill="#2557d6" stroke="#2557d6" stroke-width="1.5"/><text x="315" y="85" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >10</text><text x="335" y="85" font-size="12" text-anchor="start" font-weight="600" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >Right tractor / air lines</text><circle cx="215" cy="400" r="14" fill="#2557d6" stroke="#2557d6" stroke-width="1.5"/><text x="215" y="405" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >11</text><text x="235" y="405" font-size="12" text-anchor="start" font-weight="600" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >Brake tests (air + parking + service)</text><rect x="30" y="430" width="920" height="130" rx="10" fill="#f4f5f7" stroke="#94a3b8" stroke-width="1"/><text x="48" y="454" font-size="12.5" text-anchor="start" font-weight="400" fill="#1b1b1f" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif"><tspan x="48" dy="0">Use the 7-step method (Section 2.1) plus the CA skills-test inspection script (Section 11 / DL 650 X): approach and general condition;</tspan><tspan x="48" dy="20">engine compartment; start engine and inspect inside the cab; lights; walkaround of tractor, coupling, and trailer; then air-brake and other brake checks.</tspan><tspan x="48" dy="20">Say what you are inspecting and why (the examiner scores what you verbalize). Check both sides, landing gear, doors, suspension, brakes, tires, lights, and cargo securement.</tspan><tspan x="48" dy="20">Exact station order can follow the official score sheet the examiner uses. This map is a study aid, not a substitute for the script.</tspan></text>
  <text x="20" y="576" font-size="9.5" text-anchor="start" font-weight="400" fill="#4a4d55" font-family="Liberation Sans, DejaVu Sans, Arial, Helvetica, sans-serif" >Walkaround organized from CA Commercial Driver Handbook DL 650 (REV 12/2019) section 2.1 and Section 11 / DL 650 X vehicle inspection. Station numbers are a study sequence, not official test numbering.</text>
